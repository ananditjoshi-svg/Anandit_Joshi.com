---
layout: default
---
<article class="post">
  <header class="post-header">
    <p class="eyebrow">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d %b %Y" | upcase }}</time>
      {% if page.tag %}<span class="tag">{{ page.tag }}</span>{% endif %}
    </p>
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.summary %}<p class="post-summary">{{ page.summary }}</p>{% endif %}
  </header>

  <div class="post-body">
    {{ content }}
  </div>

  <p class="post-back"><a href="{{ '/perspectives/' | relative_url }}">← All perspectives</a></p>
</article>
