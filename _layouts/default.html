<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — AI &amp; Data in Private Markets{% endif %}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10.5' fill='none' stroke='%237A1F2B' stroke-width='2.5' stroke-linecap='round' stroke-dasharray='50 16' transform='rotate(-55 16 16)'/%3E%3Ccircle cx='16' cy='4' r='3' fill='%237A1F2B' transform='rotate(35 16 16)'/%3E%3C/svg%3E">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">
      <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <circle cx="16" cy="16" r="10.5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="50 16" transform="rotate(-55 16 16)"/>
        <circle cx="16" cy="4" r="3" fill="currentColor" transform="rotate(35 16 16)"/>
      </svg>
      <span class="wordmark">Anandit&nbsp;Joshi</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <a href="{{ '/about/' | relative_url }}">About</a>
      <a href="{{ '/research/' | relative_url }}">Research</a>
      <a href="{{ '/ventures/' | relative_url }}">Ventures</a>
      <a href="{{ '/#contact' | relative_url }}">Contact</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer" id="contact">
    <div class="footer-inner">
      <p class="footer-lede">Get in touch</p>
      <p class="footer-links">
        <a href="mailto:hello@ananditjoshi.com">hello@ananditjoshi.com</a>
        <span aria-hidden="true">·</span>
        <a href="https://www.linkedin.com/in/ananditjoshi" rel="me">LinkedIn</a>
      </p>
      <p class="footer-fine">© {{ site.time | date: "%Y" }} Anandit Joshi · Boston, MA</p>
    </div>
  </footer>
</body>
</html>
